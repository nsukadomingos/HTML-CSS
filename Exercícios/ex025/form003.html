<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <h1>Teste de Formulário</h1>
    <form>
        <fieldset>
            <legend>Dados Pessoais</legend>
            <p>
                <label for="inome">Nome: </label>
                <input type="text" name="nome" id="inome" required placeholder="Digite o seu nome">
            </p>
            <p>
                <label for="inota"> Nota: </label>
                <input type="number" name="nota" id="inota" min="1" max="10" step="0.1" required placeholder="Digite sua nota">
            </p>
            <p><label for="imes">Mês e Ano letivo: </label>
                <input type="month" name="mes" id="imes" required>
            </p>
            <p>
                <label for="idata">Data de Nascimento: </label>
                <input type="date" name="data" id="idata" required>
            </p>
            <p>
                <label for="itempo">Tempo: </label>
                <input type="time" name="tempo" id="itempo" required>
            </p>
        </fieldset>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
