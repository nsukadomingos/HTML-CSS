<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulas</title>
</head>
<body>
    <h1>Teste de Formulários</h1>
    <form action="" method="get">
        <p><label for="icor">Cor: </label> <input type="color" id="icor" name="cor" value="#FFFFFF"></p>
        <p><label for="igooding">Nível de Satisfação: </label> <input type="range" name="range" id="igooding" min="0" max="10" value="1"></p>
        <p><label for="ifile">Imagem de Perfil</label> <input type="file" name="Foto" id="ifile"></p>
        <p><input type="submit" value="Enviar"></p>
    </form>
</body>
</html>
