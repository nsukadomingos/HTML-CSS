<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <style>
        input {
            box-sizing: border-box; padding: 10px; border: 1px solid rgba(0, 0, 0, 0.075); box-shadow: 1px 1px 5px black; border-radius: 5px;
        }
    </style>
</head>
<body>
    <h1>Formulário de Cadastro</h1>
    <form method="get" autocomplete="on">
        <p>
            <label for="iemail">Email:</label>
            <input type="email" id="iemail" name="email" required autocomplete="email" placeholder="Digite seu email">
        </p>
        <p>
            <label for="itelefone">Telefone:</label>
            <input type="tel" id="itelefone" name="telefone" required>
        </p>
        <p>
            <label for="isenha">Senha:</label>
            <input type="password" id="isenha" name="senha" required minlength="8">
        </p>
        <p>
            <input type="submit" value="Enviar">
        </p>
        <p>
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
