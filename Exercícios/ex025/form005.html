<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formsss</title>
</head>
<body>
    <h1>Teste de Formulário</h1>
    <form method="get">
        <fieldset>
            <legend>Esportes Favoritos:</legend>
            <p><input type="checkbox" id="ichebox" name="chebox-basquetebol" >Basquetebol</p>
            <p><input type="checkbox" id="ichebox" name="chebox-futebol"  checked>Futebol</p>
            <p><input type="checkbox" id="ichebox" name="chebox-volei">Voleibol</p>
            <p><input type="checkbox" id="ichebox" name="chebox-natacao" >Natação</p>
            <p><input type="checkbox" id="ichebox" name="chebox-atletismo">Atletismo</p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </fieldset>
        <fieldset>
            <legend>Sexo:</legend>
            <p><input type="radio" name="sexo" id="imas">Masculino. Vladmir Putin</p>
            <p><input type="radio" name="sexo" id="ifeminino">Feminino. Gabriel</p>
            <p><input type="submit" value="Enviar"></p>
            <p><input type="search" placeholder="Procurar"></p>
        </fieldset>
    </form>
</body>
</html>
