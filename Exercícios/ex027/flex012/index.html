<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Module 1</title>
    <style>
        div.container {
            background-color: lightsalmon;
            display: flex;
        }
        div.item {
            background-color: aquamarine;
            border: 1px solid black;
        }

        div#cxA {
            flex: 4 0 100px;
        }
        div#cxB {
            flex: 3 1 100px;
        }
        div#cxC {
            flex: 0 4 100px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item" id="cxA">A</div>
        <div class="item" id="cxB">B</div>
        <div class="item" id="cxC">C</div>
    </div>
</body>
</html>
