<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Module 1</title>
    <style>
        /* Estilos para Container */
        div.container {
            background-color: aqua;
            display: flex;
            height: 500px;
        }
        div.item {
            flex: auto;
            background-color: blue;
            border: 1px solid black;
            flex-basis: 50px;
            padding: 10px;
            text-align: center;
        }
        div#first {
            background-color: red;
            align-self: flex-start;
        }

        div#second {
            background-color: orange;
        }

        div#third {
            background-color: yellow;
            align-self: flex-start;
        }

        div#fourth {
            background-color: green;
            align-self: center;
        }   
        

        div#fifth {
            background-color: blue;
        }

        div#sixth {
            background-color: indigo;
            align-self: flex-end;
        }

        div#seventh {
            background-color: violet;
            align-self: flex-end;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item" id="first">A</div>
        <div class="item" id="second">B</div>
        <div class="item" id="third">C</div>
        <div class="item" id="fourth">D</div>
        <div class="item" id="fifth">E</div>
        <div class="item" id="sixth">F</div>
        <div class="item" id="seventh">G</div>
    </div>
</body>
</html>
