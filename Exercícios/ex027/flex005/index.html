<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centralizando</title>
    <style>

        * {
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        html {
            height: 100dvh;
            width: 100vw;
        }

        html, body {
            background-color: lightsalmon;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        main {
            background-color: aquamarine;
            height: 80vh;
            width: 90vw;
            display: flex;
            flex-flow: column nowrap;
            justify-content: center;
        }

        section {
            padding: 20px;
        }

        main > section > h1 {
            text-align: center;
            padding: 10px 0px;
        }

        main > section > p {
            text-indent: 20px;
            text-align: justify;
            line-height: 20px;
            padding: 5px 0px;
        }

        main > section > div#pessoa-estudando-div {
            width: 100%;
            height: 150px;
            background-image: url(imagem/p-estudando-1200.jpg);
            background-repeat: no-repeat;
            background-position: bottom right;
        }
    </style>
</head>
<body>
    <main>
        <section>
            <h1>O meu irmão, Sniffles</h1>
            <p>Em uma sexta-feira ele me disse vai tomar no cu, e eu não gostei.</p>
        </section>

        <section>
            <div id="pessoa-estudando-div">
                <!--Aqui vem um background-->
            </div>
        </section>
    </main>
</body>
</html>
