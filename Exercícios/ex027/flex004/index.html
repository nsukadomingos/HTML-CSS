<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Module 1</title>
    <style>
        body {
            background-color: lightsalmon;
        }
        /*Alinhamento transversal*/
        div.container {
            background-color: aqua;
            display: flex;
            align-items: center;
            height: 400px;
        }
        div.item {
            height: 50px;
            flex: auto;
            padding: 5px;
            text-align: center;
            background-color: blue;
            border: 1px solid black;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">Elemento da Div {A}</div>
        <div class="item">Elemento da Div {B}</div>
        <div class="item">Elemento da Div {C}</div>
        <div class="item">Elemento da Div {D}</div>
        <div class="item">Elemento da Div {E}</div>
        <div class="item">Elemento da Div {F}</div>
        <div class="item">Elemento da Div {G}</div>
    </div>
</body>
</html>
