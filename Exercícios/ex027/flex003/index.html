<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Module 1</title>
    <style>
        div.container {
            background-color: aqua;
            display: flex;
            flex-flow: row-reverse wrap-reverse;
        }
        div.item {
            text-align: center;
            flex: auto;
            background-color: blue;
            border: 1px solid rgba(0, 0, 0, 0.555);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item"> Exemplo de Div {A}</div>
        <div class="item"> Exemplo de Div {B}</div>
        <div class="item"> Exemplo de Div {C}</div>
        <div class="item"> Exemplo de Div {D}</div>
        <div class="item"> Exemplo de Div {E}</div>
        <div class="item"> Exemplo de Div {F}</div>
        <div class="item"> Exemplo de Div {G}</div>
    </div>
</body>
</html>
